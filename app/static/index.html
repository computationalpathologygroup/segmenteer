<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>segmenteer official-results viewer</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text x='1' y='26' font-family='Inter,system-ui,sans-serif' font-weight='700' font-size='22' fill='%2302B0dd'>sg</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css?v=official-clean-ui-v1">
  <script src="https://cdn.jsdelivr.net/npm/openseadragon@4.1/build/openseadragon/openseadragon.min.js"></script>
</head>
<body>
<!-- official-results viewer: no live status, no refresh control -->

<header id="topbar">
  <div class="topbar-left">
    <span class="logo">segmenteer</span>
    <span id="run-label" class="run-label"></span>
  </div>
  <nav class="view-tabs">
    <button class="tab" data-view="overview">Overview</button>
    <button class="tab active" data-view="inspect">Inspect</button>
  </nav>
  <div class="topbar-right"></div>
</header>

<div id="layout">
  <aside id="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">Slides</span>
      <input id="search" type="text" placeholder="filter…" autocomplete="off">
    </div>
    <ul id="wsi-list"></ul>
  </aside>

  <main id="main">
    <section id="view-overview" style="display:none">
      <div class="overview-toolbar">
        <label class="toolbar-label" for="metric-select">Card score metric</label>
        <select id="metric-select" title="This value is displayed in overview cards when a prediction overlay is enabled."></select>
        <span class="toolbar-context">Shown in cards with visible prediction overlays</span>
        <div class="toolbar-actions">
        </div>
      </div>
      <div class="overview-toggles-row">
        <label class="toolbar-label">Ground truth</label>
        <div id="overview-ground-truth-bar"></div>
        <label class="toolbar-label">Prediction overlays</label>
        <div id="overview-method-bar"></div>
      </div>
      <div id="overview-grid"></div>
    </section>

    <section id="view-inspect">
      <div id="osd-container">
        <div id="osd-viewer"></div>
      </div>
      <div id="inspect-empty">
        <p>Select a slide from the sidebar to begin.</p>
      </div>
    </section>
  </main>

  <aside id="panel">
    <div id="panel-overview" style="display:none">
      <div class="panel-section">
        <div class="overview-summary-heading">
          <div class="section-heading">Evaluation</div>
        </div>
        <div id="overview-summary-table"></div>
      </div>
    </div>
    <div id="panel-inspect" style="display:flex">
      <div class="panel-section">
        <span class="panel-title" id="panel-stem"></span>
      </div>

      <div class="panel-section">
        <div class="section-heading">Prediction layers</div>
        <div id="method-toggles"></div>
      </div>

      <div class="panel-section">
        <div class="section-heading">Ground truth</div>
        <div id="ground-truth-toggle"></div>
      </div>

      <div class="panel-section">
        <div class="section-heading">Spatial error map</div>
        <label class="field-label" for="evaluation-method-select">Method</label>
        <select id="evaluation-method-select" class="evaluation-select"></select>
        <div id="evaluation-toggles" class="evaluation-toggles"></div>
        <p id="evaluation-status" class="panel-note"></p>
        <a id="error-map-link" class="error-map-link hidden" target="_blank" rel="noopener">Open comparison PNG</a>
      </div>

      <div class="panel-section">
        <div class="section-heading">Evaluation</div>
        <div id="metrics-table"></div>
      </div>
    </div>
  </aside>
</div>

<script src="/static/app.js?v=official-clean-ui-v1"></script>
</body>
</html>
