[project]
name = "segmenteer"
version = "0.0.1"
description = "segmentation benchmarking library"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0,<2.0",
    "scipy>=1.10.0",
    "scikit-image>=0.20.0",
    "scikit-learn>=1.3.0",
    "pillow>=10.0.0",
    "tifffile>=2023.0.0",
    "imagecodecs>=2023.0.0",
    "shapely>=2.0.0",
    "geojson>=3.0.0",
    "wsidicom>=0.9.0",
    "opencv-python>=4.8.0",
    "pyvips>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "matplotlib>=3.7.0",
]
entropymasker = [
    "dask>=2025.9.1",
]
histomicstk = [
    # "histomicstk>=1.0.0",
]
cpg = [
    "docker>=6.0.0",
]
openslide = [
    "openslide-python>=1.2.0",
    "openslide-bin>=2.0.0",
]
dl = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "transformers>=4.35.0",
    "huggingface_hub>=0.19.0",
    "segmentation-models-pytorch",
    "ultralytics>=8.0.0",
]
fastsam = [
    "ultralytics>=8.0.0",
    "openai-clip>=1.0",
]
all = [
    "dask>=2025.9.1",
    # "histomicstk>=1.0.0",
    "docker>=6.0.0",
    "pyvips>=2.2.0",
    "openslide-python>=1.2.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "transformers>=4.35.0",
    "huggingface_hub>=0.19.0",
    "segmentation-models-pytorch",
    "ultralytics>=8.0.0",
    "openai-clip>=1.0",
    "matplotlib>=3.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
large_image  = { index = "large_image"}

[[tool.uv.index]]
name = "large_image"
url = "https://girder.github.io/large_image_wheels"

[tool.hatch.build.targets.wheel]
packages = ["segmenteer"]
