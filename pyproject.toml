[project]
name = "segmenteer"
version = "0.1.0"
requires-python = ">=3.12.0,<3.13"
dependencies = [
    "geojson>=3.2.0",
    "numpy>=2.5.2",
    "pillow>=12.1.0",
    "pyyaml>=6.0",
    "requests>=2.34.2",
    "rich>=13.0.0",
    "scikit-image>=0.25.2",
    "scipy>=1.15.3",
    "shapely>=2.1.2",
    "tifffile>=2025.5.10",
]

[project.optional-dependencies]
# TIFF evaluation works with the core dependencies. The optional OpenSlide
# backend is recommended for vendor WSI formats and tiled pyramidal TIFFs.
wsi = [
    "imagecodecs>=2025.3.30",
]
openslide = [
    "openslide-bin>=4.0.0.11",
    "openslide-python>=1.3.0",
]

# Classical image-processing methods.
background-subtractor = [
    "opencv-python-headless>=4.11.0.86",
]
od-gmm = [
    "scikit-learn>=1.7.2",
]
entropymasker = [
    "dask>=2024.10.0",
]
# Shared deep-learning runtime.
torch = [
    "torch>=2.9.1",
    "torchvision>=0.24.1",
]

# Deep-learning methods.
# BigPicture uses the pinned upstream tissue-segmentation package. That package
# declares tensorflow-cpu, which has no macOS ARM wheel at the required 2.20
# release. The project-wide uv exclusion below replaces that otherwise-unused
# CPU-only dependency with the standard TensorFlow package on every platform,
# allowing one reproducible `uv sync --extra bigpicture` command on Apple Silicon.
bigpicture = [
    "tensorflow>=2.20.0,<2.21.0",
    "tissue-segmentation",
]
# AtlasPatch delegates WSI tissue detection to Meta SAM 2.  AtlasPatch
# intentionally does not declare SAM 2 itself, so both packages are listed
# here and are resolved/locked together by uv.
atlaspatch-sam2 = [
    "atlas-patch==1.1.0",
    "sam-2",
]
cpg = [
    "onnxruntime>=1.24.4",
    "torch>=2.9.1",
    "torchvision>=0.24.1",
    "trident",
]
fastsam = [
    "torch>=2.9.1",
    "torchvision>=0.24.1",
    "ultralytics>=8.4.6",
]
grandqc = [
    "segmentation-models-pytorch>=0.5.0",
    "torch>=2.9.1",
    "torchvision>=0.24.1",
    "tqdm>=4.67.0",
]
hest = [
    "huggingface-hub>=0.36.0",
    "torch>=2.9.1",
    "torchvision>=0.24.1",
]
pathprofiler = [
    "huggingface-hub>=0.36.0",
    "trident",
    "torch>=2.9.1",
    "torchvision>=0.24.1",
]
rtlucassen = [
    "slidesegmenter",
]
trident = [
    "trident",
    "torch>=2.9.1",
    "torchvision>=0.24.1",
]

# All supported deep-learning adapters that can be selected in run.py.
dl = [
    "atlas-patch==1.1.0",
    "sam-2",
    "huggingface-hub>=0.36.0",
    "tensorflow>=2.20.0,<2.21.0",
    "tissue-segmentation",
    "onnxruntime>=1.24.4",
    "segmentation-models-pytorch>=0.5.0",
    "slidesegmenter",
    "torch>=2.9.1",
    "torchvision>=0.24.1",
    "tqdm>=4.67.0",
    "trident",
    "ultralytics>=8.4.6",
]

# Standalone viewer and WSI-reader support.
app = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]
runtime = [
    "fastapi>=0.115.0",
    "imagecodecs>=2025.3.30",
    "openslide-bin>=4.0.0.11",
    "openslide-python>=1.3.0",
    "matplotlib>=3.10.8",
    "uvicorn[standard]>=0.32.0",
]

# One resolver-stable environment for every supported method used by run.py.
# This is deliberately flat: it does not depend on segmenteer extras from
# inside segmenteer's own metadata, which avoids self-referential resolution.
all = [
    "atlas-patch==1.1.0",
    "sam-2",
    "dask>=2024.10.0",
    "tensorflow>=2.20.0,<2.21.0",
    "tissue-segmentation",
    "fastapi>=0.115.0",
    "huggingface-hub>=0.36.0",
    "imagecodecs>=2025.3.30",
    "matplotlib>=3.10.8",
    "onnxruntime>=1.24.4",
    "openslide-bin>=4.0.0.11",
    "openslide-python>=1.3.0",
    "scikit-learn>=1.7.2",
    "segmentation-models-pytorch>=0.5.0",
    "slidesegmenter",
    "torch>=2.9.1",
    "torchvision>=0.24.1",
    "tqdm>=4.67.0",
    "trident",
    "ultralytics>=8.4.6",
    "uvicorn[standard]>=0.32.0",
    "opencv-python-headless>=4.11.0.86",
    "histomicstk>=1.3.14",
]

dev = [
    "pytest>=9.0.2",
]
histomicstk = [
    "histomicstk>=1.3.14",
]

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[[tool.uv.index]]
url = "https://girder.github.io/large_image_wheels"

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.uv.build-backend]
module-root = ""
module-name = "segmenteer"

[tool.uv.sources]
slidesegmenter = { git = "https://github.com/RTLucassen/slidesegmenter", rev = "9d9d690913d6e8520a24d678f54decccd59dce9e" }
trident = { git = "https://github.com/mahmoodlab/trident.git", rev = "adf3b7e8fdd7c815f33bec79da0d8d265200c2d6"}
tissue-segmentation = { git = "https://github.com/imi-bigpicture/tissue-segmentation.git", subdirectory = "tissue_segmentation", rev = "6d97a25a8255f591eb2c705611a32a5f56101a25"}
sam-2 = { git = "https://github.com/facebookresearch/sam2.git", rev = "2b90b9f5ceec907a1c18123530e92e794ad901a4" }
torch = [
  { index = "pytorch-cu129", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu129", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[tool.uv]
# The pinned BigPicture package requires tensorflow-cpu>=2.20, but PyPI ships
# no matching macOS ARM wheel. No other supported project dependency requires
# tensorflow-cpu, so omit it globally and install tensorflow>=2.20 explicitly
# through the BigPicture extra instead.
exclude-dependencies = [
    "tensorflow-cpu",
    "opencv-python",  # ultralytics installs the wrong opencv package
]

[tool.uv.extra-build-dependencies]
imagecodecs-numcodecs = ["imagecodecs", "numcodecs"]
