methods:
  # Global thresholding
  - name: li
    params: {mpp: 20, min_area: 1000}
  - name: li
    params: {mpp: 10, min_area: 1000}
  - name: otsu
    params: {mpp: 20, min_area: 1000}
  - name: otsu
    params: {mpp: 10, min_area: 1000}
  - name: yen
    params: {mpp: 20, min_area: 1000}
  - name: yen
    params: {mpp: 10, min_area: 1000}

  # Morphology and watershed
  - name: morphological
    params: {mpp: 20, disk_size: 3, min_area: 1000}

  - name: watershed
    params: {mpp: 20, min_distance_um: 200, min_area: 1000, merge_regions: true}
  - name: watershed
    params: {mpp: 10, min_distance_um: 200, min_area: 1000, merge_regions: true}

  # HSV thresholding
  - name: hsv-threshold
    params: {mpp: 20, min_area: 1000}
  - name: hsv-threshold
    params: {mpp: 10, min_area: 1000}

  - name: hsv-threshold-v2
    params: {mpp: 20, min_area: 1000}
  - name: hsv-threshold-v2
    params: {mpp: 10, min_area: 1000}

  # FESI (improved and original variants)
  - name: fesi
    params: {mpp: 20, improved: true}
  - name: fesi
    params: {mpp: 10, improved: true}
  - name: fesi
    params: {mpp: 20, improved: false}
  - name: fesi
    params: {mpp: 10, improved: false}

  # Other classical image processing
  - name: entropy-masker
    params: {mpp: 20}
  - name: entropy-masker
    params: {mpp: 10}
  - name: histomicstk
    params: {mpp: 20}
  - name: histomicstk
    params: {mpp: 10}
  - name: double-pass
    params: {mpp: 10}
  - name: canny-foreground
    params: {mpp: 5}
  - name: entropy-masker
    params: {mpp: 5}
  - name: fesi
    params: {mpp: 5, improved: true}

  # Deep learning methods
  - name: atlaspatch-sam2
  - name: grandqc-patchwise
  - name: trident-grandqc
  - name: nki-all-stains
    params: {mpp: 12}
  - name: fastsam
    params: {mpp: 20}
  - name: bigpicture
    params: {mpp: 8, select_largest_tissue_objects: true, apply_hole_filling: false}
  - name: rtlucassen
    params: {mpp: 7.04}
  - name: trident-rtlucassen
  - name: trident-hest
  - name: trident-pathprofiler
  - name: icgi-nnunetv2
    params: {mpp: 10}
  - name: icgi-resenc
    params: {mpp: 10}
  - name: trident-cpg

  - name: background-subtractor
    params: {mpp: 20}

  # Classical gpu
  - name: cx-tissue-seg
    params: {mpp: 40, device: "cuda"}